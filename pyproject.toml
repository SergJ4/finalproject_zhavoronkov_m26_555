[project]
name = "valutatrade-hub"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "zhavoronkov.sergey", email = "sergjav@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "prettytable>=3.18.0",
]

[project.scripts]
valutatrade-hub = "valutatrade_hub:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []
