[project]
name = "valutatrade-hub"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "zhavoronkov.sergey", email = "sergjav@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "prettytable>=3.18.0",
]

[project.scripts]
valutatrade-hub = "main:main"
project = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.hatch.build.targets.wheel]
only-include = ["valutatrade_hub", "main.py"]